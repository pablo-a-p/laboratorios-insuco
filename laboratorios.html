<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis 5 Laboratorios</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; }
  header { background: #0d47a1; color: white; padding: 20px; text-align: center; }
  nav { background: #1565c0; display: flex; justify-content: center; gap: 10px; padding: 10px; flex-wrap: wrap; }
  nav button { background: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #0d47a1; }
  nav button.active { background: #ffca28; }
  .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
  .lab { display: none; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .lab.active { display: block; }
  h2 { color: #0d47a1; }
  .code { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; overflow-x: auto; }
</style>
</head>
<body>

<header>
  <h1>Plataforma de Laboratorios</h1>
  <p>Selecciona un laboratorio para ver su contenido</p>
</header>

<nav>
  <a href="laboratorio1.html" style="background:#0a3d62; color:white; padding:10px 20px; border-radius:8px; text-decoration:none;">Ingresar a Laboratorio 1 </a>
  <a href="laboratorio2.html" style="background:#0a3d62; color:white; padding:10px 20px; border-radius:8px; text-decoration:none;">Ingresar a Laboratorio 2 </a>
  <a href="laboratorio3.html" style="background:#0a3d62; color:white; padding:10px 20px; border-radius:8px; text-decoration:none;">Ingresar a Laboratorio 3 </a>
  <a href="laboratorio4.html" style="background:#0a3d62; color:white; padding:10px 20px; border-radius:8px; text-decoration:none;">Ingresar a Laboratorio 4 </a>
  <a href="laboratorio5.html" style="background:#0a3d62; color:white; padding:10px 20px; border-radius:8px; text-decoration:none;">Ingresar a Laboratorio 5 </a>

</nav>

<script>
function mostrarLab(num) {
  document.querySelectorAll('.lab').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('lab' + num).classList.add('active');
  event.target.classList.add('active');
}
</script>

</body>
</html>
